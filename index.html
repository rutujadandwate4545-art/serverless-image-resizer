<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Image Resizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🖼️ Serverless Image Resizer</h1>
        <p class="subtitle">
            Upload an image and resize it automatically using AWS.
        </p>

        <div class="upload-box">
            <input type="file" id="imageInput" accept="image/*">

            <button id="uploadBtn">
                Upload & Resize
            </button>

            <p id="status"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
